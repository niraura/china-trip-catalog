<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="12月の中国でできる体験150件。やりたいことから行き先を逆算するためのカタログ。">
<title>中国旅行の候補地</title>
<style>
  :root {
    --paper:#EDEFF1; --card:#FFFFFF; --card-2:#F6F8F9;
    --ink:#16232E; --ink-soft:#55666F; --ink-faint:#8496A0;
    --line:#CFD7DC; --line-soft:#E1E7EA;
    --indigo:#1F4468; --vermilion:#C7442C; --celadon:#3F7A6B; --gamboge:#A9761F;
    --indigo-bg:#E4EBF2; --celadon-bg:#E0EDE8; --gamboge-bg:#F4EBDA; --verm-bg:#F7E4E0;
    --shadow:0 1px 2px rgba(22,35,46,.06), 0 8px 20px -12px rgba(22,35,46,.18);
    --font-display:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Songti SC",serif;
    --font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0F1B24; --card:#17252F; --card-2:#1D2E39;
      --ink:#E4EBEF; --ink-soft:#9BABB5; --ink-faint:#71838E;
      --line:#2A3C47; --line-soft:#223440;
      --indigo:#84B2D8; --vermilion:#EC7660; --celadon:#6FB69F; --gamboge:#D9A85A;
      --indigo-bg:#1B3346; --celadon-bg:#193630; --gamboge-bg:#33291A; --verm-bg:#3A211C;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --paper:#0F1B24; --card:#17252F; --card-2:#1D2E39;
    --ink:#E4EBEF; --ink-soft:#9BABB5; --ink-faint:#71838E;
    --line:#2A3C47; --line-soft:#223440;
    --indigo:#84B2D8; --vermilion:#EC7660; --celadon:#6FB69F; --gamboge:#D9A85A;
    --indigo-bg:#1B3346; --celadon-bg:#193630; --gamboge-bg:#33291A; --verm-bg:#3A211C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  }
  :root[data-theme="light"] {
    --paper:#EDEFF1; --card:#FFFFFF; --card-2:#F6F8F9;
    --ink:#16232E; --ink-soft:#55666F; --ink-faint:#8496A0;
    --line:#CFD7DC; --line-soft:#E1E7EA;
    --indigo:#1F4468; --vermilion:#C7442C; --celadon:#3F7A6B; --gamboge:#A9761F;
    --indigo-bg:#E4EBF2; --celadon-bg:#E0EDE8; --gamboge-bg:#F4EBDA; --verm-bg:#F7E4E0;
    --shadow:0 1px 2px rgba(22,35,46,.06), 0 8px 20px -12px rgba(22,35,46,.18);
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px 80px; }

  /* ---------- header ---------- */
  header.top { padding:44px 0 26px; border-bottom:1px solid var(--line); }
  h1 {
    font-family:var(--font-display); font-weight:600; font-size:clamp(30px,4.6vw,46px);
    line-height:1.25; margin:0 0 14px; text-wrap:balance; letter-spacing:.01em;
  }
  h1 .accent { color:var(--vermilion); }
  .lede { max-width:60ch; color:var(--ink-soft); margin:0; }

  /* ---------- controls ---------- */
  .controls {
    position:sticky; top:0; z-index:20; background:var(--paper);
    padding:14px 0 12px; border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  .search {
    flex:1 1 240px; min-width:180px; display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:2px; padding:0 10px;
  }
  .search input {
    flex:1; border:0; background:transparent; color:var(--ink);
    font-family:var(--font-body); font-size:14px; padding:9px 0; outline:none;
  }
  .search input::placeholder { color:var(--ink-faint); }
  .search svg { flex:none; opacity:.5; }
  .seg { display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--card); }
  .seg button {
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em;
    padding:8px 12px; border:0; background:transparent; color:var(--ink-soft); cursor:pointer;
  }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button[aria-pressed="true"] { background:var(--indigo); color:var(--card); }
  .favbtn {
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em;
    padding:8px 12px; border:1px solid var(--line); border-radius:2px;
    background:var(--card); color:var(--ink-soft); cursor:pointer;
  }
  .favbtn[aria-pressed="true"] { background:var(--vermilion); border-color:var(--vermilion); color:#fff; }
  .count {
    font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .count b { color:var(--vermilion); font-size:15px; }
  .reset {
    font-family:var(--font-mono); font-size:11.5px; padding:8px 10px;
    background:transparent; border:1px solid transparent; color:var(--ink-faint);
    cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .reset:hover { color:var(--vermilion); }

  /* ---------- filters ---------- */
  .filters { padding:18px 0 6px; }
  .fgroup { display:grid; grid-template-columns:78px 1fr; gap:10px 14px; margin-bottom:12px; align-items:start; }
  .flabel {
    font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; color:var(--ink-faint);
    padding-top:6px; text-align:right;
  }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip {
    font-size:12.5px; padding:4px 11px; border-radius:20px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    font-family:var(--font-body); line-height:1.6; transition:background .12s, color .12s, border-color .12s;
  }
  .chip:hover { border-color:var(--ink-faint); color:var(--ink); }
  .chip[aria-pressed="true"] { background:var(--vermilion); border-color:var(--vermilion); color:#fff; }
  .chip.k[aria-pressed="false"] { background:var(--indigo-bg); border-color:transparent; color:var(--indigo); }
  .chip.a[aria-pressed="false"] { background:var(--celadon-bg); border-color:transparent; color:var(--celadon); }
  .chip.m[aria-pressed="false"] { background:var(--gamboge-bg); border-color:transparent; color:var(--gamboge); }
  details.more { margin-top:6px; }
  details.more > summary {
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.08em; color:var(--ink-faint);
    cursor:pointer; padding:6px 0 6px 92px; list-style:none;
  }
  details.more > summary::-webkit-details-marker { display:none; }
  details.more > summary::before { content:"▸ "; }
  details.more[open] > summary::before { content:"▾ "; }
  details.more > summary:hover { color:var(--vermilion); }
  .more-body { padding-top:8px; border-top:1px dashed var(--line); margin-top:4px; }

  /* ---------- grid ---------- */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding-top:22px; }
  @media (max-width:940px) { .grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:640px) { .grid { grid-template-columns:1fr; } .fgroup { grid-template-columns:1fr; } .flabel { text-align:left; padding-top:0; } details.more > summary { padding-left:0; } }

  article.card {
    background:var(--card); border:1px solid var(--line-soft); border-radius:3px;
    padding:16px 16px 13px; display:flex; flex-direction:column; gap:9px;
    box-shadow:var(--shadow); position:relative;
  }
  .card-top { display:flex; align-items:center; gap:8px; }
  .dec {
    font-family:var(--font-mono); font-size:13px; font-weight:700; width:22px; height:22px;
    display:grid; place-items:center; border-radius:50%; flex:none;
  }
  .dec.d0 { background:var(--vermilion); color:#fff; }
  .dec.d1 { background:var(--celadon); color:#fff; }
  .dec.d2 { background:var(--celadon-bg); color:var(--celadon); }
  .dec.d3 { background:var(--gamboge-bg); color:var(--gamboge); }
  .area {
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:var(--ink-faint);
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .star {
    flex:none; background:transparent; border:0; cursor:pointer; font-size:17px; line-height:1;
    color:var(--ink-faint); padding:2px 0 2px 4px;
  }
  .star:hover { color:var(--vermilion); }
  .star[aria-pressed="true"] { color:var(--vermilion); }
  .card h3 {
    font-family:var(--font-display); font-size:19px; font-weight:600; line-height:1.4;
    margin:0; text-wrap:balance;
  }
  .copy { color:var(--vermilion); font-size:13px; margin:0; line-height:1.55; }
  .body { color:var(--ink-soft); font-size:13.5px; margin:0; line-height:1.72; flex:1; }
  .tagrow { display:flex; flex-wrap:wrap; gap:5px; }
  .tag { font-size:11px; padding:2px 8px; border-radius:20px; font-family:var(--font-body); }
  .tag.k { background:var(--indigo-bg); color:var(--indigo); }
  .tag.m { background:var(--gamboge-bg); color:var(--gamboge); }
  .meta {
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
    display:flex; flex-wrap:wrap; gap:4px 10px; padding-top:9px; border-top:1px solid var(--line-soft);
    font-variant-numeric:tabular-nums;
  }
  .meta span b { color:var(--ink-soft); font-weight:400; }
  .links { display:flex; gap:12px; }
  .links a {
    font-family:var(--font-mono); font-size:11px; letter-spacing:.04em;
    color:var(--indigo); text-decoration:none; border-bottom:1px solid transparent;
  }
  .links a:hover { border-bottom-color:var(--indigo); }
  .note { font-size:11.5px; color:var(--ink-faint); font-style:normal; margin:0; line-height:1.55; }

  /* ---------- table ---------- */
  .tablewrap { overflow-x:auto; padding-top:22px; }
  table { border-collapse:collapse; width:100%; min-width:820px; background:var(--card); font-size:13px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  th {
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:var(--ink-faint);
    cursor:pointer; user-select:none; white-space:nowrap; position:sticky; top:0; background:var(--card-2);
    border-bottom:1px solid var(--line);
  }
  th:hover { color:var(--vermilion); }
  th[aria-sort]::after { content:" ↕"; opacity:.4; }
  th[aria-sort="ascending"]::after { content:" ↑"; opacity:1; color:var(--vermilion); }
  th[aria-sort="descending"]::after { content:" ↓"; opacity:1; color:var(--vermilion); }
  td.num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-soft); white-space:nowrap; }
  td.nm { font-family:var(--font-display); font-size:14.5px; }
  tr:hover td { background:var(--card-2); }

  /* ---------- map ---------- */
  .mapsec { padding-top:26px; }
  .mapbox {
    position:relative; background:var(--card); border:1px solid var(--line-soft);
    border-radius:3px; aspect-ratio:16/10; min-height:320px; overflow:hidden; box-shadow:var(--shadow);
  }
  .mapbox svg { position:absolute; inset:0; width:100%; height:100%; }
  .landmass {
    fill:var(--indigo-bg); stroke:var(--indigo); stroke-width:1.25px;
    stroke-linejoin:round; vector-effect:non-scaling-stroke; opacity:.9;
  }
  .node { position:absolute; width:8px; height:8px; transform:translate(-50%,-50%); pointer-events:none; }
  .dot {
    display:block; width:8px; height:8px; border-radius:50%;
    background:var(--vermilion); box-shadow:0 0 0 2.5px var(--card);
  }
  .node span {
    position:absolute; white-space:nowrap; font-size:11.5px; line-height:1.4; color:var(--ink);
    background:var(--card); padding:1px 4px; border-radius:2px;
  }
  .node.r span { left:12px; top:50%; transform:translateY(-50%); }
  .node.l span { right:12px; top:50%; transform:translateY(-50%); }
  .node.t span { bottom:12px; left:50%; transform:translateX(-50%); }
  .node.b span { top:12px; left:50%; transform:translateX(-50%); }
  .times { padding-top:20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:2px 24px; }
  .times div {
    font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); display:flex;
    justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px dotted var(--line);
    font-variant-numeric:tabular-nums;
  }
  .times div b { color:var(--ink); font-weight:400; }

  /* ---------- section headings ---------- */
  h2 {
    font-family:var(--font-display); font-size:22px; font-weight:600; margin:0 0 6px;
  }
  .sublede { color:var(--ink-soft); font-size:13.5px; margin:0 0 4px; max-width:62ch; }

  .empty { padding:60px 20px; text-align:center; color:var(--ink-faint); }
  .empty p { font-family:var(--font-display); font-size:18px; margin:0 0 6px; color:var(--ink-soft); }

  /* ---------- テーマ切替 ---------- */
  header.top { position:relative; }
  .themebtn {
    position:absolute; right:0; top:44px;
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; line-height:1;
    padding:7px 10px; border:1px solid var(--line); border-radius:2px;
    background:var(--card); color:var(--ink-soft); cursor:pointer;
  }
  .themebtn:hover { border-color:var(--ink-faint); color:var(--ink); }

  /* ---------- 共有リンクの通知 ---------- */
  .banner {
    margin-top:16px; padding:10px 12px; border-radius:2px;
    font-size:13px; line-height:1.65;
    background:var(--celadon-bg); color:var(--celadon);
  }
  .banner.warn { background:var(--verm-bg); color:var(--vermilion); }
  .bnrow { display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
  .bnbtn {
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; padding:6px 11px;
    cursor:pointer; border:1px solid currentColor; border-radius:2px;
    background:transparent; color:inherit;
  }
  .bnbtn:hover { background:var(--card); }
  .star.locked, .star:disabled { opacity:.45; cursor:default; }
  .star.locked:hover, .star:disabled:hover { color:var(--ink-faint); }
  .star[aria-pressed="true"].locked { color:var(--vermilion); }
  .carrybtns button:disabled { opacity:.4; cursor:default; }
  .carrybtns button:disabled:hover { border-color:var(--line); color:var(--ink-soft); }

  /* ---------- ☆の持ち出し ---------- */
  .carry { padding:14px 0 0; display:flex; flex-direction:column; gap:8px; }
  .carrynote { margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.65; max-width:70ch; }
  .carrynote.warn { color:var(--vermilion); }
  #carryText {
    width:100%; min-height:110px; resize:vertical; box-sizing:border-box;
    font-family:var(--font-mono); font-size:12px; line-height:1.7; padding:10px;
    border:1px solid var(--line); border-radius:2px; background:var(--card); color:var(--ink);
  }
  .carrybtns { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .carrybtns button {
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; padding:8px 12px;
    cursor:pointer; border:1px solid var(--line); border-radius:2px;
    background:var(--card); color:var(--ink-soft);
  }
  .carrybtns button:hover { border-color:var(--ink-faint); color:var(--ink); }
  #carryMsg { font-family:var(--font-mono); font-size:11.5px; color:var(--celadon); }
  .favbtn.warn { border-color:var(--vermilion); color:var(--vermilion); }

  .hidden { display:none !important; }
  :focus-visible { outline:2px solid var(--vermilion); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  /* ---------- スマートフォン ---------- */
  @media (max-width:640px) {
    body { text-size-adjust:100%; -webkit-text-size-adjust:100%; }
    .themebtn { top:30px; }
    .wrap { padding:0 14px 60px; }
    header.top { padding:30px 0 20px; }
    /* 操作バーを2段に収める：1段目に検索、2段目に切替とカウント */
    .controls { padding:10px 0 9px; gap:8px; }
    .search { flex:1 1 100%; }
    .search input { padding:10px 0; font-size:16px; } /* iOSの自動ズーム防止に16px */
    .seg button { padding:9px 10px; }
    .favbtn { padding:9px 10px; }
    .count { font-size:11px; margin-left:auto; }
    .reset { padding:9px 4px; }
    /* 指で押せる大きさを確保 */
    .chip { padding:7px 13px; font-size:13px; }
    .star { font-size:20px; padding:6px 2px 6px 8px; }
    /* 概略図は縦長にして、地名が重ならないようにする */
    .mapbox { aspect-ratio:auto; height:min(58vh,360px); min-height:0; }
    .node span { font-size:10px; padding:1px 3px; }
    .card h3 { font-size:18px; }
  }
  @media (max-width:380px) {
    .node span { font-size:9px; }
    .chip { padding:6px 11px; font-size:12.5px; }
  }
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <button id="theme" class="themebtn" aria-label="表示テーマを切り替える"></button>
  <h1>中国旅行の<span class="accent">候補地</span></h1>
  <p class="lede">
    12月の中国で「できること」を150件並べました。場所ではなく体験が主役です。
    タグで絞り、気になったものに☆を付けて、そこから行き先を決めてください。
  </p>
  <div class="banner hidden" id="banner"></div>
</header>

<div class="controls">
  <label class="search">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
    <input id="q" type="search" placeholder="火鍋、温泉、夜、写真…" aria-label="キーワード検索">
  </label>
  <div class="seg" role="group" aria-label="表示切り替え">
    <button id="vCard" aria-pressed="true">カード</button>
    <button id="vTable" aria-pressed="false">表</button>
    <button id="vMap" aria-pressed="false">位置関係</button>
  </div>
  <button id="favOnly" class="favbtn" aria-pressed="false">☆ のみ</button>
  <button id="carryBtn" class="favbtn" aria-pressed="false">☆ の控え</button>
  <span class="count"><b id="shown">150</b> / 150 件</span>
  <button id="reset" class="reset">リセット</button>
</div>

<div class="carry hidden" id="carry">
  <p class="carrynote" id="carryNote"></p>
  <textarea id="carryText" spellcheck="false" aria-label="☆を付けた体験の一覧"></textarea>
  <div class="carrybtns">
    <button id="carryUrl">選択をURLにする</button>
    <button id="carrySave">ファイルに保存</button>
    <button id="carryLoad">ファイルから復元</button>
    <button id="carryCopy">コピー</button>
    <button id="carryApply">この内容で☆を置き換える</button>
    <input type="file" id="carryFile" accept=".txt,text/plain" hidden>
    <span id="carryMsg"></span>
  </div>
</div>

<div class="filters" id="filters">
  <div class="fgroup"><div class="flabel">性質</div><div class="chips" data-axis="kind"></div></div>
  <div class="fgroup"><div class="flabel">地域</div><div class="chips" data-axis="area"></div></div>
  <div class="fgroup"><div class="flabel">気分</div><div class="chips" data-axis="mood"></div></div>
  <details class="more">
    <summary>実務条件でさらに絞る（12月適性・所要時間・予算・観光地度・屋内外）</summary>
    <div class="more-body">
      <div class="fgroup"><div class="flabel">12月</div><div class="chips" data-axis="dec"></div></div>
      <div class="fgroup"><div class="flabel">所要</div><div class="chips" data-axis="time"></div></div>
      <div class="fgroup"><div class="flabel">予算</div><div class="chips" data-axis="band"></div></div>
      <div class="fgroup"><div class="flabel">観光地度</div><div class="chips" data-axis="tourist"></div></div>
      <div class="fgroup"><div class="flabel">屋内外</div><div class="chips" data-axis="io"></div></div>
    </div>
  </details>
</div>

<div class="grid" id="grid"></div>

<div class="tablewrap hidden" id="tableView">
  <table>
    <thead><tr>
      <th data-k="fav" style="width:34px">☆</th>
      <th data-k="n">体験</th>
      <th data-k="area">地域</th>
      <th data-k="kind">性質</th>
      <th data-k="decRank">12月</th>
      <th data-k="timeRank">所要</th>
      <th data-k="bandRank">予算</th>
      <th data-k="tourist">観光地度</th>

{n:"福建土楼に泊まる",area:"福建・潮汕",loc:"永定・南靖",kind:["暮らし"],mood:["じっくり見る","中国を知る"],dec:"○",decNote:"土楼の内部は暖房がなく冷える。厚着必須",time:"泊まり",cost:"門票90元前後＋宿",band:"中",tourist:"観光地",io:"半々",
copy:"円形の集合住宅の中で、一晩を過ごす",
body:"客家の人々が数百年前から住む円形の要塞住宅。中庭を囲んで4層の木造回廊が円を描く。日帰りで見るのと、中に泊まって朝の中庭を見るのとでは全く違う体験になる。",
q:"福建土楼 客家 民宿"},

{n:"潮汕の牛肉火鍋",area:"福建・潮汕",loc:"汕頭・潮州",kind:["食"],mood:["食べ倒す"],dec:"★",decNote:"寒い季節に最も合う。屋内",time:"1-2h",cost:"200〜350元／2人",band:"中",tourist:"現地の日常",io:"屋内",
copy:"部位ごとに、秒単位で茹で時間が違う",
body:"その日に潰した牛を部位ごとに切り分け、澄んだ牛骨スープに8秒、10秒、15秒と決められた時間だけ通す。脂の入り方で名前が付いた部位が10種類以上ある。中国の火鍋の中で最も繊細な系統。",
q:"潮汕 牛肉火锅"},

{n:"潮州古城と工夫茶",area:"福建・潮汕",loc:"潮州",kind:["街歩き","食","だらだら"],mood:["じっくり見る","何もしない"],dec:"◎",decNote:"温暖。茶は寒い日に効く",time:"半日",cost:"50〜150元",band:"低",tourist:"中間",io:"半々",
copy:"三つの小さな杯を、必ず三人で回す",
body:"潮汕の工夫茶は極小の急須と三つの杯で、濃く淹れて何度も回す。街のあらゆる店先でやっている。牌坊街の下を歩き、腸粉や魚のすり身の店をつまみながら、どこかの店主に茶に呼ばれるのが正しい過ごし方。",
q:"潮州古城 工夫茶 牌坊街"},

/* ===== 四川・重慶 ===== */
{n:"成都・パンダ基地の早朝",area:"四川・重慶",loc:"成都",kind:["街歩き"],mood:["じっくり見る"],dec:"★",decNote:"パンダは寒いほど活発。冬は最も動く季節",time:"半日",cost:"55元",band:"低",tourist:"観光地",io:"屋外",
copy:"寒い日ほど、パンダはよく動く",
body:"夏は寝てばかりのパンダが、冬は明らかに活動的になる。開園直後の朝食の時間に入るのが鉄則で、9時を過ぎると寝始める。ベタな場所だが、冬に行く合理的な理由がある数少ない観光地。",
q:"成都 大熊猫基地 冬天"},

{n:"鶴鳴茶社で耳かき",area:"四川・重慶",loc:"成都・人民公園",kind:["だらだら","暮らし"],mood:["何もしない","中国を知る"],dec:"◎",decNote:"冬は日差しのある日を選ぶ。屋外の竹椅子",time:"1-2h",cost:"茶20〜40元／耳かき50〜100元",band:"低",tourist:"中間",io:"屋外",
copy:"竹の椅子に沈んで、耳を掻いてもらう",
body:"成都の公園の中の茶館。竹椅子に座って蓋碗茶を頼むと、音叉を鳴らしながら「采耳」の職人が回ってくる。頭の中で金属音が響く。周りでは麻雀とトランプと昼寝。成都の時間の流れ方が体でわかる。",
q:"鹤鸣茶社 人民公园 采耳"},

{n:"成都の火鍋",area:"四川・重慶",loc:"成都",kind:["食"],mood:["食べ倒す"],dec:"★",decNote:"寒い時期が本番。屋内",time:"1-2h",cost:"200〜300元／2人",band:"中",tourist:"現地の日常",io:"屋内",
copy:"痺れと辛さは、別の感覚だと知る",
body:"花椒の「麻」と唐辛子の「辣」が別物だと体で理解する場所。鴨血、毛肚、脳花。二人なら鴛鴦鍋にせず、いきなり全紅にするかどうかが最初の分岐になる。",
q:"成都 火锅"},

{n:"重慶・洪崖洞と長江索道",area:"四川・重慶",loc:"重慶",kind:["夜遊び","乗り物","景色"],mood:["言葉を失う","はしゃぐ"],dec:"◎",decNote:"冬は霧が出やすく、夜景がさらに幻想的になる",time:"1-2h",cost:"索道30元",band:"低",tourist:"観光地",io:"半々",
copy:"11階建ての建物の、1階と11階が両方地上に面する",
body:"崖にへばりつく吊脚楼が夜に黄金色に光る。街全体が立体で、地図が意味をなさない。長江索道でロープウェイに乗り、川の上から高層ビル群を見る。冬の霧が出るとSF映画になる。",
q:"重庆 洪崖洞 长江索道 夜景"},

{n:"重慶の老火鍋",area:"四川・重慶",loc:"重慶",kind:["食"],mood:["食べ倒す"],dec:"★",decNote:"屋内。重慶の冬は湿度が高く底冷えするので火鍋が効く",time:"1-2h",cost:"180〜280元／2人",band:"中",tourist:"現地の日常",io:"屋内",
copy:"牛脂が固まって白い塊になっている鍋",
body:"成都より粗く、油が重い。九宮格という格子で仕切られた鍋の、格ごとに火力が違う。地元の人は油碟（ごま油とニンニク）で温度を下げて食べる。汗をかくことが目的の食事。",
q:"重庆 老火锅 九宫格"},

{n:"楽山大仏",area:"四川・重慶",loc:"楽山（成都から1h）",kind:["観る"],mood:["言葉を失う"],dec:"○",decNote:"冬は霧の日があるが、階段の行列が短い",time:"1日",cost:"80元前後",band:"低",tourist:"観光地",io:"屋外",
copy:"高さ71m。足の指の上に人が立てる",
body:"川の合流点の崖を丸ごと彫った座像。上から降りる桟道は狭く、混雑期は2時間待ちになるが、冬は空いている。船から正面を見る方法もあり、そちらのほうが全体像がわかる。",
q:"乐山大佛"},

/* ===== 江南 ===== */
{n:"上海・武康路のcitywalk",area:"江南",loc:"上海",kind:["街歩き"],mood:["じっくり見る","何もしない"],dec:"◎",decNote:"冬でも歩ける。プラタナスが落葉して建物がよく見える",time:"半日",cost:"無料",band:"低",tourist:"中間",io:"屋外",
copy:"目的地を決めずに、旧租界を歩き続ける",
body:"中国で完全に定着した「citywalk」の発祥地の一つ。武康大楼から安福路、五原路へ、洋館とカフェと古着屋が混ざる路地を抜けていく。冬は落葉して建物のファサードが露出する。セントレアから直行便で行ける唯一の大都市。",
q:"上海 武康路 citywalk"},

{n:"蘇州・平江路と園林",area:"江南",loc:"蘇州",kind:["街歩き"],mood:["じっくり見る"],dec:"○",decNote:"園林は冬が本来の姿。ただし江南の冬は湿って冷たい",time:"1日",cost:"門票30〜80元",band:"低",tourist:"観光地",io:"屋外",
copy:"庭は、葉が落ちてからが本番だと言われる",
body:"拙政園や網師園は、緑が減った冬にこそ石と水と窓の構図が見える設計になっている。平江路の水路沿いは上海から高鉄25分。冬の江南は気温以上に湿気で冷えるので、厚手のコートが要る。",
q:"苏州 拙政园 冬季"},

{n:"杭州・西湖の冬",area:"江南",loc:"杭州",kind:["景色","街歩き"],mood:["じっくり見る","何もしない"],dec:"○",decNote:"雪が降れば「断橋残雪」になるが、確率は低い",time:"1日",cost:"無料",band:"低",tourist:"観光地",io:"屋外",
copy:"雪が降ったときだけ完成する、名前のついた景色",
body:"西湖十景の一つ「断橋残雪」は、橋の上の雪が部分的に溶けて途切れて見える現象を指す。狙って見られるものではないが、冬の西湖は霧が湖面に乗って、それだけで水墨画になる。",
q:"西湖 断桥残雪 冬"},

{n:"上海ディズニー",area:"江南",loc:"上海",kind:["夜遊び","乗り物"],mood:["はしゃぐ"],dec:"○",decNote:"冬は空いていて待ち時間が短い。ただし屋外で終日寒い",time:"1日",cost:"475〜799元／人",band:"高",tourist:"観光地",io:"屋外",
copy:"世界最大のシンデレラ城と、一番短い列",
body:"中国の若いカップルの定番。冬の平日は待ち時間が劇的に短く、1日で主要アトラクションが回れる。ここでしか乗れないTRONのライドがある。防寒対策をしないと夜のパレードで凍える。",
q:"上海迪士尼 冬季"},

{n:"烏鎮の水郷の夜",area:"江南",loc:"桐郷（上海から1.5h）",kind:["街歩き"],mood:["じっくり見る","何もしない"],dec:"○",decNote:"冬は霧が水路に降りる。寒いが人が少ない",time:"泊まり",cost:"門票110〜190元＋宿",band:"中",tourist:"観光地",io:"屋外",
copy:"完全に整備された水郷を、あえて夜に見る",
body:"西柵は徹底的に管理・修復された水郷で、生活感はほぼない。ただし夜のライトアップだけは他に代えがきかない。水路に舟を出し、両岸の建物が水面で反転しているのを見る。中に泊まると閉園後の街を独占できる。",
q:"乌镇 西栅 夜景"},

/* ===== 北京・西安 ===== */
{n:"雪の故宮を待つ",area:"北京・西安",loc:"北京",kind:["景色"],mood:["言葉を失う","じっくり見る"],dec:"○",decNote:"12月の北京は氷点下だが暖房完備。雪は運次第",time:"1日",cost:"60元",band:"低",tourist:"観光地",io:"屋外",
copy:"朱の壁に雪が積もる日は、年に数日しかない",
body:"雪が降ると故宮は当日チケットが即完売するほど中国人が殺到する。赤い壁と黄色い瑠璃瓦に白が乗る。降らなくても冬の故宮は空気が澄んで、屋根の稜線が遠くまで見える。要事前予約。",
q:"故宫 雪"},

{n:"胡同と什刹海",area:"北京・西安",loc:"北京",kind:["街歩き","暮らし"],mood:["中国を知る","じっくり見る"],dec:"★",decNote:"湖が凍れば天然のスケートリンクになる",time:"半日",cost:"無料",band:"低",tourist:"中間",io:"屋外",
copy:"凍った湖の上を、氷の椅子で滑る",
body:"什刹海が全面凍結すると、氷面に椅子型のソリが並ぶ。北京の子供が昔からやっている遊びで、二人で押し合いながら滑る。周りの胡同では白菜が軒先に積まれ、石炭の匂いがする。",
q:"什刹海 冰场 冬"},

{n:"銅鍋の涮羊肉",area:"北京・西安",loc:"北京",kind:["食"],mood:["食べ倒す"],dec:"★",decNote:"北京の冬の食べ物そのもの。屋内で暖房完備",time:"1-2h",cost:"200〜300元／2人",band:"中",tourist:"現地の日常",io:"屋内",
copy:"湯は白湯。ネギと生姜しか入っていない",
body:"炭を入れた銅鍋で、味のついていない湯に羊肉を数秒くぐらせ、胡麻ダレで食べる。四川の火鍋と正反対の思想。窓が結露した老舗で、二人で銅鍋を挟むのが北京の冬。",
q:"涮羊肉 铜锅 北京"},

{n:"西安の城壁を自転車で一周",area:"北京・西安",loc:"西安",kind:["乗り物"],mood:["はしゃぐ"],dec:"○",decNote:"晴れれば爽快。ただし城壁の上は風が強く体感が下がる",time:"半日",cost:"門票54元＋レンタル45元",band:"低",tourist:"観光地",io:"屋外",
copy:"城壁の上を、13.7km走り切る",
body:"明代の城壁がまるごと残っていて、その上をタンデム自転車で一周できる。約2時間。壁の内側には旧市街、外側には現代の西安が広がり、境界線の上を走っている感覚になる。",
q:"西安 城墙 骑行"},

{n:"回民街と大唐不夜城",area:"北京・西安",loc:"西安",kind:["食","夜遊び"],mood:["食べ倒す","はしゃぐ"],dec:"○",decNote:"屋外の食べ歩きなので寒さ対策が要る",time:"1-2h",cost:"100〜200元／2人",band:"低",tourist:"観光地",io:"屋外",
copy:"羊肉泡饃のパンを、自分の手で千切る",
body:"回民街ではまず硬いパンを自分で細かく千切り、それを羊のスープで煮てもらう。柿子餅、肉夹馍、biang biang麺。大唐不夜城は夜に唐代の街並みを再現したライトアップで、完全な作り物だが規模で押し切ってくる。",
q:"西安 回民街 大唐不夜城"},

/* ===== 広東・海南 ===== */
{n:"三亜の海",area:"海南・北海",loc:"海南島",kind:["だらだら","景色"],mood:["何もしない"],dec:"◎",decNote:"12月で25℃前後。中国人が冬に逃げる定番の場所",time:"泊まり",cost:"宿次第（高騰しやすい）",band:"高",tourist:"観光地",io:"屋外",
copy:"12月に、海に入れる中国",
body:"中国の最南端。冬でも泳げる。中国人にとっての「冬のリゾート」がどういうものかを見る意味もある。年末年始は価格が跳ね上がるので、12月中旬までなら現実的。",
q:"三亚 冬季 海滩"},

{n:"涠洲島",area:"海南・北海",loc:"広西・北海沖",kind:["景色","だらだら"],mood:["何もしない"],dec:"○",decNote:"冬は海が荒れて欠航する日がある",time:"泊まり",cost:"上陸費115元＋宿",band:"中",tourist:"中間",io:"屋外",
copy:"火山でできた島に、フランス様式の教会が建っている",
body:"中国最大級の火山島。黒い溶岩の海岸と、清代に建てられたゴシック様式の天主堂が同居している。三亜ほど開発されておらず、原付で一周できる規模。桂林から北海へは高鉄で行ける。",
q:"涠洲岛 天主教堂"},

{n:"広州の早茶",area:"広東・香港",loc:"広州",kind:["食","暮らし"],mood:["食べ倒す","中国を知る"],dec:"◎",decNote:"温暖で屋内。乗り継ぎ拠点としても機能する",time:"1-2h",cost:"150〜250元／2人",band:"中",tourist:"現地の日常",io:"屋内",
copy:"朝7時の茶楼は、老人と新聞で埋まっている",
body:"「一盅两件」——茶一杯と点心二品。エビ餃子、焼売、腸粉、鳳爪を頼み、2時間かけて食べる。観光ではなく生活のリズムで、隣のテーブルの老人が新聞を読み終わるまでいる。南方への乗り継ぎ拠点にもなる。",
q:"广州 早茶 茶楼"},

/* ===== 普通の遊び ===== */
{n:"洗浴中心で一日過ごす",area:"各地",loc:"東北が本場・全国にある",kind:["だらだら","暮らし"],mood:["何もしない","中国を知る"],dec:"★",decNote:"寒い季節が最盛期。完全屋内で、外の寒さから完全に逃げられる",time:"1日",cost:"入場25〜168元／アカスリ込み149元前後",band:"低",tourist:"現地の日常",io:"屋内",
copy:"風呂とアカスリと仮眠と食べ放題とKTVが、一つの建物に入っている",
body:"今の中国で最も勢いのある遊び場。入浴後に浴衣を渡され、館内で仮眠・食事・映画・eスポーツ・剧本杀まで全部できる。24時間営業で、そのまま泊まる人も多い。18〜35歳が客の6割近くを占め、外国人観光客も殺到している。二人で行って別々に入り、館内で合流する。",
q:"洗浴中心 东北 搓澡"},

{n:"围炉煮茶",area:"各地",loc:"全国",kind:["だらだら","食"],mood:["何もしない"],dec:"★",decNote:"冬限定の遊び。まさに12月のためのもの",time:"1-2h",cost:"60〜150元／人",band:"低",tourist:"現地の日常",io:"半々",
copy:"炭火を囲んで、餅と芋と栗を網で焼きながら茶を飲む",
body:"数年前から中国の冬の定番になった過ごし方。小さな炭炉の上に網を置き、餅・さつまいも・栗・みかん・落花生を焼きながら、横で茶を淹れ続ける。焼き上がるまで待つ時間が長いので、席を立つ理由がない。",
q:"围炉煮茶"},

{n:"KTVの個室に二人で入る",area:"各地",loc:"全国",kind:["夜遊び"],mood:["はしゃぐ"],dec:"◎",decNote:"完全屋内。冬の夜の定番",time:"1-2h",cost:"100〜300元／2人",band:"低",tourist:"現地の日常",io:"屋内",
copy:"日本のカラオケとは、部屋の作りから違う",
body:"中国のKTVは部屋が広く、ソファがコの字で、テーブルにフルーツ盛りとナッツが出る。日本語曲も入っている店が多い。ランキング画面にその年の流行歌が並ぶので、選曲画面を眺めるだけでも中国の10年がわかる。昼間の「歓唱」時間帯なら格安。",
q:"KTV 量贩式 包厢"},

{n:"密室逃脱",area:"各地",loc:"全国",kind:["体験"],mood:["はしゃぐ"],dec:"◎",decNote:"完全屋内。中国語が要るが、読解を中国語話者に任せれば動く役でも成立する",time:"1-2h",cost:"100〜200元／人",band:"中",tourist:"現地の日常",io:"屋内",
copy:"中国の脱出ゲームは、金のかけ方が違う",
body:"日本の同種の店より予算規模が大きく、機械仕掛けやNPCの俳優が入る本格的なものが多い。中国語が必要だが、二人一組なら読解と物理作業で分担できる。剧本杀（マーダーミステリー）より言語の壁が低い。",
q:"密室逃脱 沉浸式"},

{n:"桌游吧",area:"各地",loc:"全国",kind:["だらだら"],mood:["はしゃぐ","何もしない"],dec:"◎",decNote:"完全屋内。時間制で長居できる",time:"1-2h",cost:"30〜60元／人・時間",band:"低",tourist:"現地の日常",io:"屋内",
copy:"ボードゲームカフェで、雨の午後を潰す",
body:"時間制で飲み放題が付くことが多い。ルール説明が中国語なので、言語に依存しないゲーム（ウノ、ジェンガ、体を使うもの）を選ぶと二人で成立する。天候が崩れた日の避難先として持っておくと強い。",
q:"桌游吧 桌游店"},

{n:"足浴・按摩",area:"各地",loc:"全国",kind:["だらだら"],mood:["何もしない"],dec:"◎",decNote:"歩き回った夜に効く。屋内",time:"1-2h",cost:"80〜200元／人",band:"低",tourist:"現地の日常",io:"屋内",
copy:"歩き疲れた夜を、90分で回収する",

/* ---------- ☆をURLに載せる ----------
   並び順に対するビットマップ＋版ハッシュ。版が違う古いリンクは適用しない。 */
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
let VERSION = "";
function encodeFavs() {
  const bytes = new Uint8Array(Math.ceil(DATA.length / 8));
  DATA.forEach((d, i) => { if (favs.has(d.id)) bytes[i >> 3] |= 1 << (i & 7); });
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return VERSION + "-" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeFavs(token) {
  const cut = token.indexOf("-");
  if (cut < 0) return null;
  if (token.slice(0, cut) !== VERSION) return "stale";
  let bin;
  try { bin = atob(token.slice(cut + 1).replace(/-/g, "+").replace(/_/g, "/")); }
  catch (e) { return null; }
  const picked = [];
  DATA.forEach((d, i) => {
    const byte = bin.charCodeAt(i >> 3) || 0;
    if (byte & (1 << (i & 7))) picked.push(d.id);
  });
  return picked;
}
/* ☆が変わるたびアドレスにも反映する。ブックマークでそのまま持ち運べる */
function syncHash() {
  if (readOnly) return;   // 共有リンクのURLを自分の☆で書き換えない
  try {
    history.replaceState(null, "", location.pathname + location.search + (favs.size ? "#f=" + encodeFavs() : ""));
  } catch (e) {}
}
function banner(html, isWarn) {
  const el = document.getElementById("banner");
  el.innerHTML = html;   // 差し込むのは自前の文字列のみ。URLの中身は入れない
  el.classList.toggle("warn", !!isWarn);
  el.classList.remove("hidden");
  return el;
}

/* ☆の識別子はカード名。並び順が変わっても控えが壊れないようにする */
function loadFavs() {
  try {
    const raw = JSON.parse(localStorage.getItem("cn-dec-favs") || "[]");
    const names = new Set(DATA.map(d => d.n));
    return new Set(raw
      .map(v => /^e\d+$/.test(v) ? (DATA[+v.slice(1)] || {}).n : v)   // 旧・連番IDからの移行
      .filter(v => names.has(v)));
  } catch (e) { return new Set(); }
}
function saveFavs() {
  if (readOnly) return;   // 共有リンク閲覧中は保存経路を完全に塞ぐ
  try { localStorage.setItem("cn-dec-favs", JSON.stringify([...favs])); } catch (e) {}
  syncHash();
}
let favs = loadFavs();
/* 共有リンクを開いているあいだは読み取り専用。
   このブラウザに保存された☆には、一切手を触れない。 */
let readOnly = false;
let localFavs = null;   // 読み取り専用のあいだ、退避しておく自分の☆
let favOnly = false, view = "card", sortKey = null, sortDir = 1;

VERSION = fnv1a(DATA.map(d => d.n).join("\n")).toString(36);
DATA.forEach(d => { d.id = d.n; d.decRank = RANK.dec[d.dec]; d.timeRank = RANK.time[d.time]; d.bandRank = RANK.band[d.band]; });

/* ---------- build filter chips ---------- */
document.querySelectorAll(".chips").forEach(box => {
  const axis = box.dataset.axis;
  AXES[axis].forEach(v => {
    const b = document.createElement("button");
    b.className = "chip " + (AXIS_CLASS[axis] || "");
    b.textContent = CHIP_LABEL[v] || v;
    b.setAttribute("aria-pressed","false");
    b.onclick = () => {
      if (sel[axis].has(v)) { sel[axis].delete(v); b.setAttribute("aria-pressed","false"); }
      else { sel[axis].add(v); b.setAttribute("aria-pressed","true"); }
      render();
    };
    box.appendChild(b);
  });
});

/* ---------- filtering ---------- */
function matches(d) {
  if (favOnly && !favs.has(d.id)) return false;
  for (const axis of ["kind","mood"]) {
    if (sel[axis].size && ![...sel[axis]].some(v => d[axis].includes(v))) return false;
  }
  for (const axis of ["area","dec","time","band","tourist","io"]) {
    if (sel[axis].size && !sel[axis].has(d[axis])) return false;
  }
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (q) {
    const hay = [d.n,d.copy,d.body,d.loc,d.area,d.decNote,d.cost,...d.kind,...d.mood].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

/* ---------- render ---------- */
function imgLinks(d) {
  const g = "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(d.q);
  const x = "https://www.xiaohongshu.com/search_result?keyword=" + encodeURIComponent(d.q);
  return `<div class="links"><a href="${g}" target="_blank" rel="noopener">画像を見る ↗</a><a href="${x}" target="_blank" rel="noopener">小紅書 ↗</a></div>`;
}
function decClass(v) { return v === "★" ? "d0" : v === "◎" ? "d1" : v === "○" ? "d2" : "d3"; }

function render() {
  const list = DATA.filter(matches);
  document.getElementById("shown").textContent = list.length;

  const grid = document.getElementById("grid");
  const tv = document.getElementById("tableView");
  const mv = document.getElementById("mapView");
  const em = document.getElementById("empty");
  grid.classList.toggle("hidden", view !== "card" || !list.length);
  tv.classList.toggle("hidden", view !== "table" || !list.length);
  mv.classList.toggle("hidden", view !== "map");
  em.classList.toggle("hidden", list.length > 0 || view === "map");

  if (view === "card") {
    grid.innerHTML = list.map(d => `
      <article class="card">
        <div class="card-top">
          <span class="dec ${decClass(d.dec)}" title="12月適性">${d.dec}</span>
          <span class="area">${d.area}${d.loc ? " · " + d.loc : ""}</span>
          <button class="star${readOnly ? ' locked' : ''}" data-id="${d.id}" aria-pressed="${favs.has(d.id)}" ${readOnly ? "disabled" : ""} aria-label="${readOnly ? '共有リンク閲覧中は変更できません' : '気になるに追加'}">${favs.has(d.id) ? "★" : "☆"}</button>
        </div>
        <h3>${d.n}</h3>
        <p class="copy">${d.copy}</p>
        <p class="body">${d.body}</p>
        <p class="note">12月 ${d.dec}：${d.decNote}</p>
        <div class="tagrow">
          ${d.kind.map(k => `<span class="tag k">${k}</span>`).join("")}
          ${d.mood.map(m => `<span class="tag m">${m}</span>`).join("")}
        </div>
        <div class="meta">
          <span><b>${d.time}</b></span><span><b>${d.cost}</b></span>
          <span><b>${d.tourist}</b></span><span><b>${d.io}</b></span>
        </div>
        ${imgLinks(d)}
      </article>`).join("");
  }

  if (view === "table") {
    let rows = list.slice();
    if (sortKey) {
      rows.sort((a,b) => {
        let av = sortKey === "fav" ? (favs.has(a.id) ? 0 : 1) : a[sortKey];
        let bv = sortKey === "fav" ? (favs.has(b.id) ? 0 : 1) : b[sortKey];
        if (Array.isArray(av)) { av = av[0]; bv = bv[0]; }
        return (av > bv ? 1 : av < bv ? -1 : 0) * sortDir;
      });
    }
    document.getElementById("tbody").innerHTML = rows.map(d => `
      <tr>
        <td><button class="star${readOnly ? ' locked' : ''}" data-id="${d.id}" aria-pressed="${favs.has(d.id)}" ${readOnly ? "disabled" : ""} aria-label="${readOnly ? '共有リンク閲覧中は変更できません' : '気になるに追加'}">${favs.has(d.id) ? "★" : "☆"}</button></td>
        <td class="nm">${d.n}<br><span style="font-size:11.5px;color:var(--ink-faint)">${d.copy}</span></td>
        <td class="num">${d.area}</td>
        <td class="num">${d.kind.join("・")}</td>
        <td class="num">${d.dec}</td>
        <td class="num">${d.time}</td>
        <td class="num">${d.cost}</td>
        <td class="num">${d.tourist}</td>
        <td class="num">${d.io}</td>
      </tr>`).join("");
  }

  document.querySelectorAll(".star").forEach(s => {
    s.onclick = () => {
      if (readOnly) return;   // 二重の歯止め
      const id = s.dataset.id;
      if (favs.has(id)) favs.delete(id); else favs.add(id);
      saveFavs();
      render();
    };
  });

  syncCarry();
}

/* ---------- map ---------- */
const mapbox = document.getElementById("mapbox");
const mapsvg = document.getElementById("mapsvg");
/* 緯度が上がるほど経度1度は短くなる。中緯度の係数をかけて形を実物に近づける */
const LON_K = 0.82;
const proj = (lon, lat) => [lon * LON_K, -lat];
const toPath = pts => "M" + pts.map(p => proj(p[0], p[1]).map(v => v.toFixed(2)).join(" ")).join("L") + "Z";
document.getElementById("mainland").setAttribute("d", toPath(BORDER));
document.getElementById("hainanIsle").setAttribute("d", toPath(HAINAN));

const nodeEls = NODES.map(n => {
  const el = document.createElement("div");
  el.className = "node " + n.s;
  el.innerHTML = `<span class="dot"></span><span>${n.l}</span>`;
  mapbox.appendChild(el);
  return el;
});

/* 横長なら中国全土、縦長なら東側に寄せて描く */
function fitMap() {
  const w = mapbox.clientWidth, h = mapbox.clientHeight;
  if (!w || !h) return;
  const ar = w / h;
  const wide = ar >= 1.45;
  let x0 = (wide ? 73 : 96) * LON_K, x1 = 136 * LON_K;
  let y0 = wide ? -54.5 : -48, y1 = -14.5;
  const bw = x1 - x0, bh = y1 - y0;
  if (bw / bh < ar) { const d = (bh * ar - bw) / 2; x0 -= d; x1 += d; }
  else { y0 -= bw / ar - bh; }   // 余りは北側（内モンゴル・黒龍江）に逃がす
  mapsvg.setAttribute("viewBox", `${x0} ${y0} ${x1 - x0} ${y1 - y0}`);
  NODES.forEach((n, i) => {
    const [x, y] = proj(n.lon, n.lat);
    nodeEls[i].style.left = ((x - x0) / (x1 - x0) * 100) + "%";
    nodeEls[i].style.top = ((y - y0) / (y1 - y0) * 100) + "%";
  });
}
addEventListener("resize", fitMap);

document.getElementById("times").innerHTML = TIMES.map(t => `<div>${t[0]}<b>${t[1]}</b></div>`).join("");

/* ---------- controls ---------- */
document.getElementById("q").oninput = render;
document.getElementById("favOnly").onclick = e => {
  favOnly = !favOnly; e.currentTarget.setAttribute("aria-pressed", favOnly); render();
};
document.getElementById("reset").onclick = () => {
  Object.values(sel).forEach(s => s.clear());
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed","false"));
  document.getElementById("q").value = "";
  favOnly = false; document.getElementById("favOnly").setAttribute("aria-pressed","false");
  render();
};
/* ---------- ☆の控え（保存が効かない環境の逃げ道） ---------- */
const carry = document.getElementById("carry");
const carryText = document.getElementById("carryText");
const carryNote = document.getElementById("carryNote");
const carryMsg = document.getElementById("carryMsg");
const carryBtn = document.getElementById("carryBtn");

/* 保存が残ると確認できていないうちは、控えを取るよう促す */
const KEEP = "下のファイル保存かコピー";
const RISKY = !STORE_OK || !PERSIST_PROVEN;
carryNote.textContent =
  !STORE_OK
    ? "このブラウザは☆の保存自体を拒否しています。タブを閉じると消えるので、" + KEEP + "で控えてください。"
  : !PERSIST_PROVEN
    ? (EMBEDDED
        ? "☆がタブを閉じたあとも残るか、まだ確認できていません。このページは埋め込み表示で、Safari では埋め込み内の保存がタブを閉じた時点で破棄されます。確実に残すには、" + KEEP + "で控えるか、このページを別タブで直接開いてください。"
        : "☆がタブを閉じたあとも残るか、まだ確認できていません。一度閉じて開き直すと確認できます。それまでは" + KEEP + "で控えておくと安全です。")
    : "☆はこのブラウザに保存されており、タブを閉じても残ることを確認済みです。別の端末やブラウザに移すときは、" + KEEP + "を使ってください。";
carryNote.classList.toggle("warn", RISKY);
if (RISKY) carryBtn.classList.add("warn");

function syncCarry() {
  if (carry.classList.contains("hidden")) return;
  if (document.activeElement === carryText) return;   // 編集中は上書きしない
  carryText.value = DATA.filter(d => favs.has(d.id)).map(d => d.n).join("\n");
}
carryBtn.onclick = () => {
  const open = !carry.classList.toggle("hidden");
  carryBtn.setAttribute("aria-pressed", open);
  carryMsg.textContent = "";
  syncCarry();
};
/* ファイルに保存（サンドボックス外なので通常のダウンロードが使える） */
const carrySave = document.getElementById("carrySave");
carrySave.onclick = () => {
  if (!carryText.value.trim()) { carryMsg.textContent = "☆がまだ付いていません"; return; }
  const url = URL.createObjectURL(new Blob([carryText.value + "\n"], { type: "text/plain;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "中国旅行_気になる体験.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  carryMsg.textContent = "保存しました";
};

/* ファイルから復元 */
const carryFile = document.getElementById("carryFile");
document.getElementById("carryLoad").onclick = () => carryFile.click();
carryFile.onchange = () => {
  const f = carryFile.files && carryFile.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    carryText.value = String(r.result || "").trim();
    document.getElementById("carryApply").onclick();
  };
  r.onerror = () => { carryMsg.textContent = "ファイルを読めませんでした"; };
  r.readAsText(f);
  carryFile.value = "";
};

/* 選択をURLにして渡す */
document.getElementById("carryUrl").onclick = async () => {
  if (!favs.size) { carryMsg.textContent = "☆がまだ付いていません"; return; }
  const url = location.origin + location.pathname + "#f=" + encodeFavs();
  try {
    await navigator.clipboard.writeText(url);
    carryMsg.textContent = "URLをコピーしました。相手に送れば同じ☆が開きます";
  } catch (e) {
    carryText.value = url;
    carryText.select();
    carryMsg.textContent = "上の欄にURLを出しました。⌘Cでコピーしてください";
  }
};

document.getElementById("carryCopy").onclick = async () => {
  carryText.select();
  try {
    await navigator.clipboard.writeText(carryText.value);
    carryMsg.textContent = "コピーしました";
  } catch (e) {
    carryMsg.textContent = "選択しました。⌘C でコピーしてください";
  }
};
document.getElementById("carryApply").onclick = () => {
  const names = new Set(DATA.map(d => d.n));
  const lines = carryText.value.split("\n").map(v => v.trim()).filter(Boolean);
  const picked = lines.filter(v => names.has(v));
  const dropped = lines.length - picked.length;
  favs = new Set(picked);
  saveFavs();
  render();
  carryMsg.textContent = picked.length + "件を☆にしました" + (dropped ? "（一致しない" + dropped + "行は無視）" : "");
};

/* 保存を伴う操作をまとめて止める／戻す */
function lockWrites(on) {
  ["carryApply", "carryLoad"].forEach(id => {
    const b = document.getElementById(id);
    if (!b) return;
    b.disabled = on;
    b.title = on ? "共有リンクの閲覧中は使えません" : "";
  });
}

/* 共有リンクで開かれたときは閲覧専用にする。
   このブラウザに保存された☆は、読み替えも書き換えもしない。 */
(function readShared() {
  const m = /[#?&]f=([^&]+)/.exec(location.hash + "&" + location.search.slice(1));
  if (!m) return;
  const r = decodeFavs(decodeURIComponent(m[1]));
  if (r === "stale") {
    banner("この共有リンクは古い版のものです。候補の一覧が更新されているため、☆は変更していません。", true);
    return;
  }
  if (!r) { banner("共有リンクを読み取れませんでした。☆は変更していません。", true); return; }

  /* 表示だけを共有された☆に差し替える。保存領域は読まれも書かれもしない */
  localFavs = new Set(favs);
  favs = new Set(r);
  readOnly = true;
  lockWrites(true);

  banner(
    "共有された☆を表示しています（" + r.length + "件）。<b>この画面は閲覧専用です。</b>" +
    "☆の付け外しはできません。" +
    (localFavs.size
      ? "このブラウザに保存されている自分の☆（" + localFavs.size + "件）には一切触れていません。"
      : "このブラウザにはまだ自分の☆がありません。") +
    '<span class="bnrow"><button class="bnbtn" id="bnMine">自分の☆に戻る</button></span>', true);

  document.getElementById("bnMine").onclick = () => {
    readOnly = false;
    favs = new Set(localFavs);
    localFavs = null;
    lockWrites(false);
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    render();
    banner("自分の☆（" + favs.size + "件）に戻りました。ここからは付け外しと保存ができます。", false);
  };
  render();
})();

const views = { vCard:"card", vTable:"table", vMap:"map" };
Object.keys(views).forEach(id => {
  document.getElementById(id).onclick = () => {
    view = views[id];
    Object.keys(views).forEach(k => document.getElementById(k).setAttribute("aria-pressed", k === id));
    document.getElementById("filters").classList.toggle("hidden", view === "map");
    render();
    if (view === "map") fitMap();   // 非表示のあいだは寸法が取れないので、表示後に測る
  };
});
document.querySelectorAll("th").forEach(th => {
  th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
    document.querySelectorAll("th").forEach(o => o.removeAttribute("aria-sort"));
    th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending");
    render();
  };
});

render();
</script>
</body>
</html>
